name: Deploy Frontend (Angular)

# The `develop` push trigger was removed on 2026-09-05.
#
# It ran on `runs-on: [self-hosted, uat]` — a Pi 4 B that was repurposed as the
# broadcast appliance on 2026-08-29. No such runner exists, so every push to
# `develop` queued a job that waited for a machine that is never coming back:
# a red or eternally-pending check that means nothing, which is worse than no
# check at all because people learn to ignore it.
#
# Restore it by re-adding the trigger AND pointing `runs-on` at a runner that
# exists. Manual dispatch is left in place deliberately, so the workflow can
# still be driven once there is somewhere for it to land.
on:
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production

jobs:
  deploy-uat:
    name: Deploy to UAT (Pi 4 B)
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'uat')
    runs-on: [self-hosted, uat]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build for production
        run: npm run build

      - name: Deploy to Nginx
        run: |
          sudo rsync -a --delete dist/indianolympicdream/browser/ /var/www/iod-frontend/
          sudo chown -R www-data:www-data /var/www/iod-frontend/
          sudo nginx -t && sudo systemctl reload nginx

      - name: Verify deployment
        run: |
          sleep 2
          curl -sf http://localhost/ > /dev/null && echo "✅ Frontend is live" || echo "❌ Frontend check failed"


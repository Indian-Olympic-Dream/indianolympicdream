<div>
  @switch (block.blockType) {
    <!-- For each blockType, we render the corresponding component -->
    @case ('richText') {
      <app-rich-text-block [block]="block"></app-rich-text-block>
    }
    @case ('pullQuote') {
      <app-pull-quote-block [block]="block"></app-pull-quote-block>
    }
    @case ('blockquote') {
      <app-blockquote-block [block]="block"></app-blockquote-block>
    }
    @case ('text') {
      <app-text-block [block]="block"></app-text-block>
    }
    @case ('imageGallery') {
      <app-image-gallery-block [block]="block"></app-image-gallery-block>
    }
    @case ('image') {
      <app-image-block [block]="block"></app-image-block>
    }
    @case ('embedBlock') {
      @for (embedItem of block.embed; track embedItem) {
        <app-embed-block [block]="embedItem"></app-embed-block>
      }
    }
  }
</div>

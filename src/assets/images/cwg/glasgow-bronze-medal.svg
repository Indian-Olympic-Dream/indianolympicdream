<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Premium Shimmer Bronze Gradients -->
    <linearGradient id="bronze-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6A6"/>
      <stop offset="20%" stop-color="#EA580C"/>
      <stop offset="45%" stop-color="#8B4513"/>
      <stop offset="70%" stop-color="#FDBA74"/>
      <stop offset="90%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <linearGradient id="bronze-surface" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="30%" stop-color="#D97706"/>
      <stop offset="65%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="bronze-lattice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#270A03"/>
      <stop offset="100%" stop-color="#140401"/>
    </linearGradient>

    <!-- Deep Blue Ribbon Gradient -->
    <linearGradient id="blue-ribbon-grad-b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E2447"/>
      <stop offset="30%" stop-color="#1E4785"/>
      <stop offset="60%" stop-color="#2B5CA0"/>
      <stop offset="85%" stop-color="#163668"/>
      <stop offset="100%" stop-color="#0B1A33"/>
    </linearGradient>

    <filter id="medal-drop-shadow-b" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Blue Woven Ribbon with White Chevron Emblem -->
  <g class="ribbon-assembly">
    <path d="M 74 0 L 63 70 L 137 70 L 126 0 Z" fill="url(#blue-ribbon-grad-b)"/>
    <path d="M 68 0 L 60 70 M 76 0 L 70 70 M 84 0 L 80 70 M 92 0 L 90 70 M 100 0 L 100 70 M 108 0 L 110 70 M 116 0 L 120 70 M 124 0 L 130 70" 
          stroke="rgba(255,255,255,0.14)" stroke-width="1.8"/>
    <g transform="translate(100, 35) scale(0.65)" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22,-10 L-11,7 L0,-10 L11,7 L22,-10"/>
      <path d="M-13,-10 L0,9 L13,-10"/>
    </g>
  </g>

  <!-- Solid Metal Loop Attachment -->
  <path d="M 66 62 C 66 54 134 54 134 62 L 138 72 C 138 76 62 76 62 72 Z" fill="url(#bronze-bevel)" stroke="#431407" stroke-width="0.8"/>

  <!-- Medal Shield Outer Body -->
  <g filter="url(#medal-drop-shadow-b)">
    <path d="M 36 74 Q 100 64 164 74 Q 176 146 100 234 Q 24 146 36 74 Z" fill="url(#bronze-bevel)" stroke="#270A03" stroke-width="1.5"/>
    <path d="M 42 78 Q 100 70 158 78 Q 168 142 100 226 Q 32 142 42 78 Z" fill="url(#bronze-surface)"/>

    <!-- Left Clyde Bridge Lattice Girder Grid -->
    <g opacity="0.6" stroke="url(#bronze-lattice)" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M 46 82 Q 72 76 89 82 Q 97 148 78 200 Q 41 148 46 82 Z" stroke-width="2"/>
      <line x1="48" y1="88" x2="87" y2="103"/>
      <line x1="50" y1="108" x2="89" y2="123"/>
      <line x1="53" y1="128" x2="87" y2="143"/>
      <line x1="56" y1="148" x2="83" y2="163"/>
      <line x1="60" y1="168" x2="78" y2="183"/>
      <line x1="85" y1="88" x2="50" y2="103"/>
      <line x1="88" y1="108" x2="52" y2="123"/>
      <line x1="87" y1="128" x2="54" y2="143"/>
      <line x1="83" y1="148" x2="58" y2="163"/>
      <line x1="78" y1="168" x2="62" y2="183"/>
      <path d="M 67 80 Q 79 138 69 192" stroke-width="1.6"/>
    </g>

    <!-- Right Side Glasgow 2026 Logo -->
    <g transform="translate(126, 102)" text-anchor="middle">
      <g stroke="#1C0A00" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-24,-22 L-16,0 L-8,-22 L0,0 L8,-22 L16,0 L24,-22" stroke-width="4.5"/>
        <path d="M-16,-22 L0,2 L16,-22" stroke-width="3.8"/>
        <path d="M-8,-22 L0,-6 L8,-22" stroke-width="3.2"/>
      </g>
      <text x="0" y="16" font-family="'Geist Sans', system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="0.6" fill="#1C0A00">COMMONWEALTH</text>
      <text x="0" y="29" font-family="'Geist Sans', system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="1.2" fill="#1C0A00">GAMES</text>
      <text x="0" y="43" font-family="'Geist Sans', system-ui, sans-serif" font-size="10" font-weight="950" letter-spacing="1.4" fill="#140700">GLASGOW 2026</text>
    </g>

    <path d="M 42 78 Q 100 70 158 78" stroke="rgba(255,255,255,0.75)" stroke-width="2.5" fill="none"/>
  </g>
</svg>
